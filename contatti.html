<main class="site-main">
  <section class="contact-page-section reveal-section">
    <div class="site-container">
      <div class="contact-page-grid">

        <!-- Titolo principale (occupa le prime colonne su desktop) -->
        <div class="contact-title-col">
          <h1 class="section-title">Contattami!</h1>
        </div>

        <!-- Form di contatto (occupa la parte destra) -->
        <div class="contact-form-col">
            <form id="contact-form" class="custom-contact-form" action="#" method="POST">

              <div class="form-group">
                <label for="user-name" class="form-label-custom">Nome</label>
                <input type="text" id="user-name" name="from_name" class="form-control-custom" placeholder="Dimmi il tuo nome" autocomplete="name" required>
              </div>

              <div class="form-group">
                <label for="user-email" class="form-label-custom">Email</label>
                <input type="email" id="user-email" name="from_email" class="form-control-custom" placeholder="Ora la tua Email" autocomplete="email" required>
              </div>

              <div class="form-group">
                <label for="user-message" class="form-label-custom">Messaggio</label>
                <textarea id="user-message" name="message" class="form-control-custom textarea-custom" rows="3" placeholder="Scrivimi!" required></textarea>
              </div>

              <div class="form-submit-wrapper">
                <button type="submit" class="btn btn-editorial btn-editorial-dark cta-submit-btn">
                  <span>INVIA IL MESSAGGIO</span>
                  <span class="cta-arrow">&gt;</span>
                </button>
              </div>

            </form>
          </div>

      </div>
    </div>
  </section>
